<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>STUDENT REGISTRATION FORM</title>
</head>
<body>
 <div class="frame">
 <div class="image">
 <img class="wait" src="./background.jpg" alt="">
 </div>
<div class="form">
 <h1>REGISTRATION FORM</h1>
 <div class="fields">
 <div class="inputs">
 <div class="name">
 <input name="firstName" id="input1" type="text" placeholder="ENTER YOUR
FIRST NAME">
 <input name="lastName" id="input2" type="text" placeholder="ENTER YOUR
LAST NAME">
 </div>
 <input name="email" id="input3" type="text" placeholder="ENTER YOUR
EMAIL">
 <input name="password" id="input4" type="text" placeholder="ENTER YOUR
PASSWORD">
 </div>
 <div class="check">
 <input id="checkBox" type="checkbox">
 <p>Remember Me</p>
 </div>
 </div>
 <div class="btn">
 <button id="ok">OK</button>
 <button id="clear">CLEAR</button>
 </div>
 </div>
 </div>
 <script src="./script.js"></script>
</body>
</html>
